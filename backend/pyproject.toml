[project]
name = "procurement-assistant-backend"
version = "1.0.0"
description = "Conversational assistant over the State of California large-purchases dataset"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.51.0",
    "sse-starlette>=3.4.0",
    # PyMongo's native async client. Motor is deliberately absent: it reached
    # end of life on 2026-05-14 (see specs/.../research.md R1).
    "pymongo>=4.17.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.5.0",
    "openai>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.0",
    "structlog>=26.1.0",
    "rapidfuzz>=3.14.0",
    "pandas>=3.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

[tool.mypy]
python_version = "3.13"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
